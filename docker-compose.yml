# docker compose up -d --build   then open http://localhost:8000
services:
  gaemi:
    build: .
    image: gaemi
    container_name: gaemi
    restart: unless-stopped
    user: "${GAEMI_UID:-1000}:${GAEMI_GID:-1000}"  # files in ./data stay yours: set both to `id -u` / `id -g` if not 1000
    ports:
      - "127.0.0.1:8000:8000"  # this machine only. Never "8000:8000": the page has no login and holds your keys,
                               # and inside Docker the app can't tell a LAN or internet client from this machine
    volumes:
      - ./data:/app/data
